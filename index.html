<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:translateY(0);} }
  @keyframes bob { 0%,100% { transform:translateY(0);} 50% { transform:translateY(6px);} }
  @keyframes bobCenter { 0%,100% { transform:translate(-50%,-50%);} 50% { transform:translate(-50%,calc(-50% + 6px));} }
  @keyframes glowPulse { 0%,100% { opacity:0.6; transform:scale(1);} 50% { opacity:1; transform:scale(1.4);} }
</style>
</helmet>
<div style="background:#0a0a0a;">
  <div ref="{{ containerRef }}" style="position:relative; height:{{ scrollHeight }};">
    <div style="position:sticky; top:0; left:0; width:100%; height:100vh; overflow:hidden; background:#0a0a0a; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; opacity:{{ introOpacity }}; transition:opacity 0.9s ease;">

      <!-- printer machine group (real reference photo, de-branded) -->
      <div style="position:absolute; inset:0; z-index:2; opacity:{{ frameOpacity }}; transition:opacity 0.6s ease; transform:scale({{ sceneScale }}); transform-origin:50% 55%;">
        <img src="./frame-only.png" alt="" style="position:absolute; left:calc(50vw - 24vmin); top:calc(50vh - 22.42vmin); width:48vmin; height:44.84vmin; filter:{{ frameFilter }};"></img>
        <!-- top rail bar, bobs with the toolhead and overlaps the static posts to hide any seam -->
        <img src="./rail-bar.png" alt="" style="position:absolute; left:calc(50vw - 17vmin); top:{{ railTop }}; width:34.27vmin; height:8.14vmin; filter:{{ frameFilter }};"></img>
        <!-- neon filament spool hanging beside the control box -->
        <img src="./filament-spool.png" alt="" style="position:absolute; left:calc(50vw + 15.8vmin); top:calc(50vh - 12vmin); width:4.5vmin; height:15.6vmin; object-fit:contain;"></img>
        <!-- animated toolhead sprite -->
        <img src="./toolhead-sprite.png" alt="" style="position:absolute; left:{{ toolheadLeft }}; top:{{ toolheadTop }}; width:6.78vmin; height:15.14vmin;"></img>
        <div style="position:absolute; left:{{ nozzleGlowLeft }}; top:{{ nozzleGlowTop }}; width:0.5vmin; height:0.5vmin; border-radius:50%; background:#D6FF3F; box-shadow:0 0 0.8vmin 0.25vmin rgba(214,255,63,0.7); animation:glowPulse 1.4s ease-in-out infinite;"></div>
      </div>

      <!-- printed logo -->
      <div style="position:absolute; left:{{ logoLeft }}; top:{{ logoTop }}; width:{{ logoWidth }}; height:{{ logoHeight }}; transition:left 1s cubic-bezier(.4,0,.2,1), top 1s cubic-bezier(.4,0,.2,1), width 1s cubic-bezier(.4,0,.2,1), height 1s cubic-bezier(.4,0,.2,1); z-index:3;">
        <div style="position:absolute; inset:0; overflow:hidden;">
          <div style="position:absolute; inset:0; clip-path:{{ logoClip }};">
            <img src="./theta-logo.png" alt="" style="width:100%; height:100%; display:block; object-fit:contain;"></img>
          </div>
        </div>
      </div>

      <!-- nav wordmark -->
      <div style="position:absolute; top:88px; left:50%; transform:translateX(-50%); opacity:{{ statusOpacity }}; transition:opacity 0.4s ease; color:#8a8a8a; font-size:13px; letter-spacing:0.18em; text-transform:uppercase; text-align:center; z-index:5;">
        <div style="color:#D6FF3F; font-size:12px; margin-bottom:6px;">{{ statusText }}</div>
        <div style="width:220px; height:2px; background:rgba(255,255,255,0.12); border-radius:2px; overflow:hidden;">
          <div style="height:100%; width:{{ progressPct }}; background:#D6FF3F;"></div>
        </div>
      </div>

      <!-- scroll hint -->
      <div style="position:absolute; bottom:{{ hintBottom }}; left:50%; transform:translateX({{ hintShift }}); opacity:{{ hintOpacity }}; transition:opacity 0.4s ease; color:#5a5a5a; font-size:13px; letter-spacing:0.3em; text-transform:uppercase; text-align:center; z-index:5;">
        <span style="display:inline-block; animation:bob 1.8s ease-in-out infinite;">Scroll to print ↓</span>
      </div>

      <!-- layer progress -->
      <div style="position:absolute; top:calc(50vh + 24vmin); left:50%; transform:translateX(-50%); opacity:{{ statusOpacity }}; transition:opacity 0.4s ease; color:#8a8a8a; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; text-align:center; z-index:5;">{{ layerText }}</div>

      <!-- opening hero, fades/lifts away as the print begins -->
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:{{ heroOpacity }}; transform:{{ heroTransform }}; transition:opacity 0.5s ease, transform 0.5s ease; pointer-events:none; z-index:6;">
        <div style="text-align:center; max-width:80vw;">
          <div style="color:#5a5a5a; font-size:13px; letter-spacing:0.3em; text-transform:uppercase; margin-bottom:18px; opacity:0; animation:fadeUp 0.8s ease 0.15s both;">Theta Lab 3D</div>
          <div style="color:#f2f2f2; font-size:clamp(32px,6vw,72px); font-weight:600; line-height:1.05; letter-spacing:-0.01em; opacity:0; animation:fadeUp 0.9s ease 0.35s both;">A Bright Start<br/>To Every Idea</div>
          <div style="color:#8a8a8a; font-size:15px; letter-spacing:0.05em; margin-top:20px; opacity:0; animation:fadeUp 0.8s ease 0.6s both;">Watch the A1 bring our mark to life</div>
        </div>
      </div>

    </div>
  </div>

  <!-- the real site, revealed once the print completes -->
  <iframe src="./site.html" title="Theta Labs" style="position:fixed; inset:0; width:100vw; height:100vh; border:0; background:#0a0a0a; opacity:{{ siteOpacity }}; pointer-events:{{ sitePointer }}; transition:opacity 0.9s ease; z-index:20;"></iframe>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;sceneScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.1,&quot;min&quot;:0.7,&quot;max&quot;:1.4,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Printer scene&quot;},&quot;frameFinish&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;graphite&quot;,&quot;options&quot;:[&quot;steel&quot;,&quot;graphite&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Printer scene&quot;},&quot;printDuration&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:425,&quot;min&quot;:250,&quot;max&quot;:700,&quot;step&quot;:25,&quot;unit&quot;:&quot;vh&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;showHero&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;hintBottom&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:55,&quot;min&quot;:20,&quot;max&quot;:500,&quot;step&quot;:5,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Scroll hint&quot;},&quot;hintX&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:25,&quot;min&quot;:-400,&quot;max&quot;:400,&quot;step&quot;:5,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Scroll hint&quot;}}">
class Component extends DCLogic {
  containerRef = React.createRef();
  state = { progress: 0, completed: false, revealed: false };

  componentDidMount() {
    this._onScroll = () => this.handleScroll();
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this.handleScroll();
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll);
  }

  handleScroll() {
    const el = this.containerRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const scrollable = rect.height - window.innerHeight;
    let p = scrollable > 0 ? (-rect.top) / scrollable : 0;
    p = Math.min(1, Math.max(0, p));
    if (!this.state.completed) this.setState({ progress: p });
    if (p >= 0.985 && !this.state.completed && !this._completing) {
      this._completing = true;
      setTimeout(() => this.setState({ completed: true }), 450);
      // let the printed logo settle into the corner, then reveal the site
      setTimeout(() => this.setState({ revealed: true }), 1500);
    }
  }

  renderVals() {
    const progress = this.state.progress;
    const completed = this.state.completed;
    const revealed = this.state.revealed;
    const pct = Math.round(progress * 100);

    const logoLeft = completed ? '24px' : 'calc(50vw - 7.15vmin)';
    const logoTop = completed ? '18px' : 'calc(50vh - 5.02vmin)';
    const logoWidth = completed ? '27px' : '11.04vmin';
    const logoHeight = completed ? '43px' : '17.58vmin';

    const showHero = this.props.showHero ?? true;
    const heroFade = Math.min(1, progress / 0.14);
    const heroOpacity = (completed || !showHero) ? 0 : 1 - heroFade;
    const heroTransform = `translateY(${-heroFade * 34}px) scale(${1 - heroFade * 0.06})`;
    const sceneReveal = showHero ? heroFade : 1;

    const wave = (progress * 10) % 2;
    const xOff = wave <= 1 ? wave : 2 - wave;
    const toolheadXvmin = (xOff - 0.5) * 6;
    const toolheadLeft = `calc(50vw - ${5.24 - toolheadXvmin}vmin)`;
    const nozzleGlowLeft = `calc(50vw - ${1.85 - toolheadXvmin}vmin)`;

    const zWave = (progress * 14) % 2;
    const zOff = zWave <= 1 ? zWave : 2 - zWave;
    const toolheadZvmin = (zOff - 0.5) * 1.6;
    const toolheadTop = `calc(50vh - ${19.71 - toolheadZvmin}vmin)`;
    const nozzleGlowTop = `calc(50vh - ${4.88 - toolheadZvmin}vmin)`;
    // rail bar is fixed to the frame posts (only the toolhead moves in Z) — keeping it static avoids a seam/gap against the frame image
    const railTop = `calc(50vh - 17.9vmin)`;

    const sceneScale = Number(this.props.sceneScale) || 1;
    const duration = this.props.printDuration ?? 400;
    const finish = this.props.frameFinish ?? 'steel';
    const frameFilter = finish === 'graphite' ? 'brightness(0.6) contrast(1.15)' : 'none';

    return {
      heroOpacity,
      heroTransform,
      scrollHeight: `${duration}vh`,
      sceneScale,
      frameFilter, toolheadLeft, nozzleGlowLeft, toolheadTop, nozzleGlowTop, railTop,
      containerRef: this.containerRef,
      progressPct: pct + '%',
      statusText: completed ? 'READY' : `PRINTING · ${pct}%`,
      layerText: completed ? '' : `LAYER ${Math.round(progress * 316)}/316`,
      statusOpacity: completed ? 0 : 1,
      hintOpacity: (progress < 0.04 && !completed) ? 1 : 0,
      hintBottom: (Number(this.props.hintBottom) || 80) + 'px',
      hintShift: `calc(-50% + ${Number(this.props.hintX) || 0}px)`,
      frameOpacity: completed ? 0 : sceneReveal,
      navBarOpacity: completed ? 1 : 0,
      wordmarkOpacity: completed ? 1 : 0,
      logoClip: `inset(${(1 - progress) * 100}% 0 0 0)`,
      logoLeft, logoTop, logoWidth, logoHeight,
      introOpacity: revealed ? 0 : 1,
      siteOpacity: revealed ? 1 : 0,
      sitePointer: revealed ? 'auto' : 'none'
    };
  }
}
</script>
</body>
</html>
